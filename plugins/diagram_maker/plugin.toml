[plugin]
name = "diagram_maker"
display_name = "Diagram Maker"
description = "Create and edit Mermaid diagrams in a side panel"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "git-branch"
color = "#10b981"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "Diagram Maker"
icon = "git-branch"
description = "Mermaid diagram creation workspace"
accent_color = "#10b981"
toolbar = ["create_diagram", "update_diagram"]
default_artifact_type = "mermaid"
auto_open_panel = true
