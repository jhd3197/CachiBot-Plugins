[plugin]
name = "blog_writer"
display_name = "Blog Writer"
description = "Create and edit blog articles with rich markdown canvas"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "pen-line"
color = "#ec4899"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "Blog Writer"
icon = "pen-line"
description = "Blog article writing workspace"
accent_color = "#ec4899"
toolbar = ["create_blog_post", "update_blog_post"]
default_artifact_type = "markdown"
auto_open_panel = true
