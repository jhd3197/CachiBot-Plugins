[plugin]
name = "resume_builder"
display_name = "Resume Builder"
description = "Create professional resumes and CVs with canvas preview"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "user"
color = "#6366f1"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "Resume Builder"
icon = "user"
description = "Resume and CV design workspace"
accent_color = "#6366f1"
toolbar = ["create_resume", "update_resume"]
default_artifact_type = "html"
auto_open_panel = true
