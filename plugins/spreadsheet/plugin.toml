[plugin]
name = "spreadsheet"
display_name = "Spreadsheet"
description = "Create interactive data tables and spreadsheets with canvas preview"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "table"
color = "#22c55e"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "Spreadsheet"
icon = "table"
description = "Data table and spreadsheet workspace"
accent_color = "#22c55e"
toolbar = ["create_spreadsheet", "update_spreadsheet"]
default_artifact_type = "html"
auto_open_panel = true
