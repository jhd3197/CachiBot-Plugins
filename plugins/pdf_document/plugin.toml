[plugin]
name = "pdf_document"
display_name = "PDF Document"
description = "Create print-ready PDF-style documents with canvas preview"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "file-down"
color = "#ef4444"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "PDF Document"
icon = "file-down"
description = "Print-ready document design workspace"
accent_color = "#ef4444"
toolbar = ["create_pdf", "update_pdf"]
default_artifact_type = "html"
auto_open_panel = true
system_prompt = """
## PDF Document Tools
You have access to `create_pdf` and `update_pdf` tools for producing print-ready PDF-style documents.

**When to use these tools:** Whenever the user asks you to create a PDF, printable document, formal report, letter, invoice, certificate, or any content intended for print or PDF export, you MUST use `create_pdf` instead of writing content inline.

**How to decide:**
- If the user wants a document formatted for print or PDF output, use `create_pdf`.
- If the user asks a quick question or wants a brief conversational reply, respond inline as normal.
- If the user asks to revise or update an existing PDF document, use `update_pdf` with the document identifier.

Use print-friendly HTML with proper page formatting and give the document a descriptive title.
"""
