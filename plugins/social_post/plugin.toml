[plugin]
name = "social_post"
display_name = "Social Post"
description = "Preview social media posts for Twitter, LinkedIn, and Instagram"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "share-2"
color = "#0ea5e9"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "Social Post"
icon = "share-2"
description = "Social media post preview workspace"
accent_color = "#0ea5e9"
toolbar = ["create_social_post", "update_social_post"]
default_artifact_type = "html"
auto_open_panel = true
