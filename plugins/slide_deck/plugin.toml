[plugin]
name = "slide_deck"
display_name = "Slide Deck"
description = "Create presentation slides with live canvas preview"
version = "0.1.0"
author = "CachiBot Team"
type = "tool"

[plugin.ui]
icon = "presentation"
color = "#f59e0b"
group = "Creative"

[plugin.scope]
contexts = ["chat", "room"]

[plugin.requires]
python = ">=3.10"
filesystem = false
network = false
imports = []

[plugin.permissions]
allow_env_vars = []
allow_paths = []

[plugin.workspace]
display_name = "Slide Deck"
icon = "presentation"
description = "Presentation slide design workspace"
accent_color = "#f59e0b"
toolbar = ["create_slides", "update_slides"]
default_artifact_type = "html"
auto_open_panel = true
